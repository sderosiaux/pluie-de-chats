<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e9e4ec">
<title>Pluie de Chats — Carambolage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f4a;
    --ink-soft: rgba(59, 47, 74, 0.6);
    --paper: #fffdfb;
    --backdrop: rgba(233, 228, 236, 0.72);
    --action: #6b4fa0;
    --action-press: #59408a;
    --line: rgba(59, 47, 74, 0.14);
    --font-display: 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-text: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #e9e4ec; color: var(--ink);
    font-family: var(--font-text);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }

  #finish {
    position: fixed;
    padding: 0.55em 1.1em;
    border-radius: 999px;
    background: var(--action); color: var(--paper);
    font-family: var(--font-display); font-weight: 800;
    box-shadow: 0 3px 0 var(--action-press);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #finish:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--action-press); }

  #end {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--backdrop);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: 24px;
  }
  #end[hidden], #finish[hidden], #error[hidden] { display: none; }
  .card {
    width: min(330px, 100%);
    background: var(--paper);
    border-radius: 28px;
    padding: 26px 24px 20px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(59, 47, 74, 0.16);
    animation: card-in 0.28s cubic-bezier(0.2, 1.3, 0.5, 1);
  }
  @keyframes card-in { from { transform: scale(0.9); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .paws { display: flex; justify-content: center; gap: 10px; font-size: 44px; line-height: 1; }
  .paw { filter: grayscale(1); opacity: 0.25; transition: opacity 0.2s; }
  .paw.on { filter: none; opacity: 1; }
  #end-title { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin-top: 10px; }
  .score { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  #end-bonus { display: block; min-height: 1.2em; font-size: 13px; color: var(--ink-soft); }
  .stats { display: flex; justify-content: center; gap: 28px; margin: 16px 0 20px; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; }
  .stats small { font-size: 13px; color: var(--ink-soft); }
  #replay {
    width: 100%;
    padding: 16px 0;
    border-radius: 999px;
    background: var(--action); color: var(--paper);
    font-family: var(--font-display); font-weight: 800; font-size: 24px;
    box-shadow: 0 4px 0 var(--action-press);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #replay:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--action-press); }
  #next {
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: transparent;
    font-family: var(--font-display); font-weight: 600; font-size: 17px;
    color: var(--action);
    transition: background 0.15s ease;
  }
  #next:hover { background: var(--line); }

  #error {
    position: fixed; left: 16px; right: 16px; top: 16px;
    padding: 14px 16px; border-radius: 16px;
    background: var(--paper); border: 2px solid #e0303c;
    font-size: 15px;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Pluie de chats : touche au-dessus du lanceur pour viser, relâche pour tirer"></canvas>

<button id="finish" type="button" hidden>Finir l'averse</button>

<div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
  <div class="card">
    <div class="paws" aria-hidden="true"><span class="paw">🐾</span><span class="paw">🐾</span><span class="paw">🐾</span></div>
    <h1 id="end-title">Averse terminée</h1>
    <div class="score"><span id="end-score">0</span></div>
    <span id="end-bonus"></span>
    <div class="stats">
      <div><b id="end-chain">×0</b><small>meilleure chaîne</small></div>
      <div><b id="end-caught">0/0</b><small>chats attrapés</small></div>
    </div>
    <button id="replay" type="button">Rejouer</button>
    <button id="next" type="button">Averse suivante</button>
  </div>
</div>

<div id="error" role="alert" hidden></div>

<script type="module" src="/src/game/main.ts"></script>
</body>
</html>
